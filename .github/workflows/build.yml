name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/leicaframe.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/leicaframe.jks" >> $GITHUB_ENV
          else
            echo "::warning::KEYSTORE_B64 secret belum ditetapkan — APK guna kunci debug sementara"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/LeicaFrame-v${VERSION_NAME}.apk

      - name: Publish test images
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd app/build && zip -qr test-images.zip test-out || exit 0
          gh release view test-images >/dev/null 2>&1 || gh release create test-images --prerelease --title "Engine test images" --notes "Output ujian enjin automatik"
          gh release upload test-images test-images.zip --clobber

      - name: Upload test images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            app/build/test-out/
            app/build/reports/tests/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeicaFrame-v${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: LEICA FRAME v${{ env.VERSION_NAME }}
          body: |
            APK automatik dari commit ${{ github.sha }}.
            Muat turun `LeicaFrame-v${{ env.VERSION_NAME }}.apk` dan pasang di telefon (Android 8.0+).
          files: out/*.apk
          make_latest: true
