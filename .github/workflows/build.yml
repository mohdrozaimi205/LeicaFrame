name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/LeicaFrame-v${VERSION_NAME}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeicaFrame-v${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: LEICA FRAME v${{ env.VERSION_NAME }}
          body: |
            APK automatik dari commit ${{ github.sha }}.
            Muat turun `LeicaFrame-v${{ env.VERSION_NAME }}.apk` dan pasang di telefon (Android 8.0+).
          files: out/*.apk
          make_latest: true
